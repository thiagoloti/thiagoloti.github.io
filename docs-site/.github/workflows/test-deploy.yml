name: Test deployment
on:
  pull_request:
    branches:
      - source  # ✅ Mudou para source
jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs-site  # ✅ ADICIONE ISSO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: ./docs-site/yarn.lock  # ✅ ADICIONE ISSO
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test build website
        run: yarn build