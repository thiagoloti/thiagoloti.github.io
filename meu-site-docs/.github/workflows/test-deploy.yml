name: Test deployment
on:
  pull_request:
    branches:
      - source
jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn  # ✅ Mudou de npm para yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile  # ✅ Mudou de npm ci
      - name: Test build website
        run: yarn build  # ✅ Mudou de npm run build